# Tests both forms of the controller and builds the .bwextension.
# Also called by release.yml, which publishes the artifact built here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node test/mock-host.test.js

  scala:
    name: Scala extension
    runs-on: ubuntu-latest
    # maven.bitwig.com can be very slow; the sbt cache avoids it after the
    # first successful run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # as shipped with Bitwig 5
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt scalafmtCheckAll scalafmtSbtCheck test assembly
      - uses: actions/upload-artifact@v7
        with:
          name: bwextension
          path: target/PitchBendBridge.bwextension
          if-no-files-found: error
