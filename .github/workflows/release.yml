# Run from Actions → Release → Run workflow on main with a SemVer version.
# Sets the version in version.sbt and the script, verifies and builds, pushes
# the "Release vX" commit and the tag to main, and publishes a GitHub release
# with the script and the .bwextension. A version with a suffix (0.2.0-rc.1)
# becomes a prerelease.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so CI does not
# run again for the release commit; this job verifies it before pushing.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, e.g. 0.2.0 or 0.2.0-rc.1
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the input
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run the release from main, not $GITHUB_REF"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a SemVer version such as 0.2.0 or 0.2.0-rc.1"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Set the version
        run: |
          old=$(sed -n 's/^ThisBuild \/ version := "\(.*\)"$/\1/p' version.sbt)
          sed -i "s/^ThisBuild \/ version := \".*\"$/ThisBuild \/ version := \"$VERSION\"/" version.sbt
          sed -i "s/^  \"${old//./\\.}\",$/  \"$VERSION\",/" PitchBendBridge.control.js
          git diff

      # Also fails if the script's version was not updated above.
      - uses: ./.github/actions/verify

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release $TAG"
          fi
          git tag -a "$TAG" -m "Pitch Bend Bridge $TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Publish the release
        run: |
          flags=(--verify-tag --title "Pitch Bend Bridge $TAG" --generate-notes)
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" \
            PitchBendBridge.control.js \
            target/PitchBendBridge.bwextension
